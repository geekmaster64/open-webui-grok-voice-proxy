#cloud-config
hostname: hexxus-ai-01
fqdn: hexxus-ai-01.hexxus.net
manage_etc_hosts: true
users:
  - name: btahedl
    groups: [sudo, adm]
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_public_key}
package_update: true
packages:
  - qemu-guest-agent
  - open-vm-tools
runcmd:
  - systemctl enable --now qemu-guest-agent || true
  - systemctl enable --now open-vm-tools || true
final_message: "hexxus-ai-01 cloud-init done. OS config is Ansible, not cloud-init."
