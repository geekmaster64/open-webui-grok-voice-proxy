# TLS terminator for ai.hexxus.net → Open WebUI on 127.0.0.1:8080.
# nginx stays on the host (apt), not in Docker.

upstream open_webui {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name ai.hexxus.net;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ai.hexxus.net;

    ssl_certificate     /etc/letsencrypt/live/ai.hexxus.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ai.hexxus.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # Let's Encrypt multi-perspective checks must not be geo-filtered.
    # LAN/VPN CIDRs are $is_us=1 in geo-us.conf.
    if ($is_us = 0) {
        return 403;
    }

    location = /api/v1/auths/signin {
        limit_req zone=owui_login burst=10 nodelay;
        include /etc/nginx/snippets/open-webui-proxy.conf;
        proxy_pass http://open_webui;
    }

    location = /api/v1/auths/signup {
        limit_req zone=owui_login burst=5 nodelay;
        include /etc/nginx/snippets/open-webui-proxy.conf;
        proxy_pass http://open_webui;
    }

    # Safari talk-mode TTS unlock/pause fix. Query string busts Safari cache.
    # File lives in /var/www because /home/btahedl is mode 750 (www-data cannot read it).
    location = /hexxus-talk-tts-webaudio-2.js {
        alias /var/www/hexxus/talk-tts-fix.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        include /etc/nginx/snippets/open-webui-proxy.conf;
        proxy_set_header Accept-Encoding "";
        sub_filter '</head>' '<script src="/hexxus-talk-tts-webaudio-2.js"></script></head>';
        sub_filter_once on;
        sub_filter_types text/html;
        proxy_pass http://open_webui;
    }
}
