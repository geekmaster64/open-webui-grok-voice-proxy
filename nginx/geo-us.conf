# http context. /etc/nginx/conf.d/20-geo-us.conf
# $is_us = 1 for RFC1918/VPN/loopback and advertised US CIDRs.
# WAN geo is a complement to the UDM-Pro country filter, not a replacement.
geo $is_us {
    default 0;

    127.0.0.0/8      1;
    10.0.0.0/8       1;
    172.16.0.0/12    1;
    192.168.0.0/16   1;
    169.254.0.0/16   1;
    ::1/128          1;
    fc00::/7         1;
    fe80::/10        1;

    include /etc/nginx/geoip/us.conf;
}
